name: Release

# `v3.0.0` のようなタグを push すると pack して NuGet に publish する。
# タグ名と Directory.Build.props の <Version> が食い違っていたら失敗させる。
#
# 事前に必要な設定:
#   - リポジトリのシークレット NUGET_API_KEY に nuget.org の API キーを登録する

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: pack & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: タグ名と Version の一致を確認
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          props_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          echo "tag=$tag_version props=$props_version"
          if [ "$tag_version" != "$props_version" ]; then
            echo "::error::タグ ($tag_version) と Directory.Build.props の Version ($props_version) が一致していません"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/CSStack.TADA/CSStack.TADA.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
